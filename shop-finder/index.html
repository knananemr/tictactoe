<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F8FE">
  <!-- Content-Security-Policy: the csp plugin in vite.config.mjs writes the meta tag here (one policy for the dev server, one for builds) -->
  <meta name="description" content="Find great local barbers, salons and clinics near you — including the small ones you'd walk right past.">
  <title>קרוב אליי — Nearby</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2C9.9 2 5 6.8 5 12.8 5 20.5 16 30 16 30s11-9.5 11-17.2C27 6.8 22.1 2 16 2z' fill='%234B3ACF'/%3E%3Ccircle cx='16' cy='12.6' r='4.6' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#app" id="skipLink">דילוג לתוכן</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="קרוב אליי">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M16 2C9.9 2 5 6.8 5 12.8 5 20.5 16 30 16 30s11-9.5 11-17.2C27 6.8 22.1 2 16 2z" fill="#4B3ACF"/>
        <circle cx="16" cy="12.6" r="4.6" fill="#fff"/>
      </svg>
      <span class="brand-name" id="brandName"><span class="brand-en" lang="en" dir="ltr">Nearby</span><span class="brand-he" lang="he" dir="rtl">קרוב אליי</span></span>
    </a>
    <div class="topbar-actions">
      <a class="btn btn-sm btn-owner" href="#/new" id="navNew">פתיחת עסק</a>
      <button class="btn btn-ghost btn-sm btn-icon" id="langBtn" type="button">EN</button>
    </div>
  </header>
  <div class="net-banner" id="netBanner" hidden></div>

  <main id="app" tabindex="-1">
    <noscript><p style="padding:24px">This app needs JavaScript. · האפליקציה צריכה JavaScript.</p></noscript>
  </main>

  <!-- announcements for screen readers (must exist before its text changes) -->
  <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
